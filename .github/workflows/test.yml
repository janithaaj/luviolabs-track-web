# FE CI: lint/build always; e2e boots sibling Nest API + Mongo.
#
# Assumptions:
# - This repo is named luvio-tracker
# - API lives at <github.repository_owner>/luvio-tracker-api (same org/user)
# - Override via workflow_dispatch input `api_repository` (owner/name)
# - Private API: set repo secret API_CHECKOUT_TOKEN (PAT with contents:read)
#   Public same-org API: default GITHUB_TOKEN is enough

name: Test

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      api_repository:
        description: 'API GitHub repo as owner/name (default: <owner>/luvio-tracker-api)'
        required: false
        type: string
        default: ''

concurrency:
  group: fe-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
  PLAYWRIGHT_API_URL: http://localhost:4000/api/v1

jobs:
  lint-build:
    name: Lint & build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout FE
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ env.NEXT_PUBLIC_API_URL }}

  e2e:
    name: Playwright e2e
    needs: lint-build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # API runtime (e2e hits a real Nest process, not mongodb-memory-server).
      # JWT secrets: prefer repo secrets; otherwise generate per-run (never commit real secrets).
      PORT: '4000'
      MONGODB_URI: mongodb://127.0.0.1:27017/luvio-tracker-ci
      JWT_EXPIRES_IN: 1h
      JWT_REFRESH_EXPIRES_IN: 7d
      CORS_ORIGIN: http://localhost:3001,http://127.0.0.1:3001
      NODE_ENV: development
      CI: true

    steps:
      - name: Checkout FE
        uses: actions/checkout@v4
        with:
          path: luvio-tracker

      - name: Resolve API repository
        id: api_repo
        run: |
          if [ -n "${{ inputs.api_repository }}" ]; then
            echo "name=${{ inputs.api_repository }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${{ github.repository_owner }}/luvio-tracker-api" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout API
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.api_repo.outputs.name }}
          path: luvio-tracker-api
          # Private sibling: set API_CHECKOUT_TOKEN (PAT). Else github.token.
          token: ${{ secrets.API_CHECKOUT_TOKEN != '' && secrets.API_CHECKOUT_TOKEN || github.token }}

      - name: Generate ephemeral CI credentials
        run: |
          if [ -n "${{ secrets.JWT_SECRET }}" ]; then
            echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> "$GITHUB_ENV"
          else
            echo "JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          fi
          if [ -n "${{ secrets.JWT_REFRESH_SECRET }}" ]; then
            echo "JWT_REFRESH_SECRET=${{ secrets.JWT_REFRESH_SECRET }}" >> "$GITHUB_ENV"
          else
            echo "JWT_REFRESH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          fi
          echo "ADMIN_EMAIL=ci-admin-${GITHUB_RUN_ID}@example.invalid" >> "$GITHUB_ENV"
          echo "ADMIN_PASSWORD=$(openssl rand -hex 24)" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            luvio-tracker/package-lock.json
            luvio-tracker-api/package-lock.json

      - name: Install API dependencies
        working-directory: luvio-tracker-api
        run: npm ci

      - name: Seed API database
        working-directory: luvio-tracker-api
        run: npm run seed
        env:
          ADMIN_EMAIL: ${{ env.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ env.ADMIN_PASSWORD }}
          JWT_SECRET: ${{ env.JWT_SECRET }}
          JWT_REFRESH_SECRET: ${{ env.JWT_REFRESH_SECRET }}

      - name: Build API
        working-directory: luvio-tracker-api
        run: npm run build

      - name: Start API
        working-directory: luvio-tracker-api
        env:
          JWT_SECRET: ${{ env.JWT_SECRET }}
          JWT_REFRESH_SECRET: ${{ env.JWT_REFRESH_SECRET }}
          ADMIN_EMAIL: ${{ env.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ env.ADMIN_PASSWORD }}
        run: |
          # nest-cli emits dist/main.js (start:prod path may differ locally)
          nohup node dist/main.js > /tmp/luvio-api.log 2>&1 &
          echo $! > /tmp/luvio-api.pid
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null -X POST http://127.0.0.1:4000/api/v1/auth/login \
              -H 'Content-Type: application/json' \
              -d "{\"email\":\"${ADMIN_EMAIL}\",\"password\":\"${ADMIN_PASSWORD}\"}"; then
              echo "API is up"
              exit 0
            fi
            sleep 2
          done
          echo "API failed to become ready"
          cat /tmp/luvio-api.log || true
          exit 1

      - name: Install FE dependencies
        working-directory: luvio-tracker
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: luvio-tracker
        run: npx playwright install --with-deps chromium

      - name: Run Playwright
        working-directory: luvio-tracker
        run: npm run test:e2e
        env:
          NEXT_PUBLIC_API_URL: ${{ env.NEXT_PUBLIC_API_URL }}
          PLAYWRIGHT_API_URL: ${{ env.PLAYWRIGHT_API_URL }}
          PLAYWRIGHT_ADMIN_EMAIL: ${{ env.ADMIN_EMAIL }}
          PLAYWRIGHT_ADMIN_PASSWORD: ${{ env.ADMIN_PASSWORD }}

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            luvio-tracker/playwright-report/
            luvio-tracker/test-results/
          retention-days: 7

      - name: Dump API logs on failure
        if: failure()
        run: cat /tmp/luvio-api.log || true
